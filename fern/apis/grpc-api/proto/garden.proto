syntax = "proto3";

package garden.v1;

option go_package = "github.com/fern-api/ledger-test-site/garden/v1";

import "google/api/annotations.proto";
import "fern/options.proto";

// Service for managing garden beds and planting schedules.
service GardenService {
  // Create a new garden bed with specified dimensions and soil type.
  rpc CreateBed(CreateBedRequest) returns (CreateBedResponse) {
    option (google.api.http) = {
      post: "/garden/v1/beds"
      response_body: "bed"
      body: "*"
    };
    option (fern.summary) = "Create a garden bed";
  }

  // Retrieve details about an existing garden bed.
  rpc GetBed(GetBedRequest) returns (GetBedResponse) {
    option (google.api.http) = {
      get: "/garden/v1/beds/{bed_id}"
      response_body: "bed"
    };
    option (fern.summary) = "Get a garden bed";
  }
}

// Request to create a new garden bed.
message CreateBedRequest {
  string name = 1;
  double width_meters = 2;
  double length_meters = 3;
  SoilType soil_type = 4;
}

// Response containing the newly created garden bed.
message CreateBedResponse {
  GardenBed bed = 1;
}

// Request to retrieve a garden bed by ID.
message GetBedRequest {
  string bed_id = 1;
}

// Response containing the requested garden bed.
message GetBedResponse {
  GardenBed bed = 1;
}

// Represents a garden bed with its physical attributes and contents.
message GardenBed {
  string id = 1;
  string name = 2;
  double width_meters = 3;
  double length_meters = 4;
  SoilType soil_type = 5;
  repeated string planted_species = 6;
  int64 created_at = 7;
}

// Type of soil in a garden bed.
enum SoilType {
  SOIL_TYPE_UNSPECIFIED = 0;
  SOIL_TYPE_LOAMY = 1;
  SOIL_TYPE_SANDY = 2;
  SOIL_TYPE_CLAY = 3;
  SOIL_TYPE_PEAT = 4;
}
