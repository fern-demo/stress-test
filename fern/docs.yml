instances:
  - url: fern-stress-test.docs.buildwithfern.com

title: Fern Stress Test

ai-examples:
  enabled: false

layout:
  searchbar-placement: header
  page-width: full
  tabs-placement: header

products:
  - display-name: Stress Test
    path: ./products/stress-test/stress-test.yml
    icon: zap
    slug: stress-test
    subtitle: Stress testing with 1000+ pages

  - display-name: Garden
    path: ./products/garden/garden.yml
    icon: leaf
    slug: garden
    subtitle: Garden management and plant care

  - display-name: Nursery
    path: ./products/nursery/nursery.yml
    icon: tree
    slug: nursery
    subtitle: Wholesale plant nursery operations

navbar-links:
  - type: secondary
    text: Get support
    url: "mailto:support@buildwithfern.com"
  - type: primary
    text: Get a Demo
    url: https://buildwithfern.com/contact

colors:
  accentPrimary:
    dark: "#f0c193"
    light: "#af5f1b"

logo:
  dark: ./docs/assets/logo-dark-mode.png
  light: ./docs/assets/logo-light-mode.png
  height: 40

favicon: ./docs/assets/favicon.png

experimental:
  dynamic-snippets: true

redirects:
  - source: /old-welcome
    destination: /garden/guides/get-started/welcome
  - source: /legacy-api/plants
    destination: /garden/plant-api
  - source: /legacy-nursery
    destination: /nursery/overview/about/nursery-overview
